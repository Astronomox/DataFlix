<div class="container mx-auto">
  <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Get in Touch</h1>
  <p class="mt-1 text-gray-600 dark:text-gray-400">Have an issue or a suggestion? We'd love to hear from you.</p>

  <div class="mt-8 max-w-2xl mx-auto">
    <div class="bg-white/30 dark:bg-gray-800/30 backdrop-blur-lg border border-white/20 dark:border-gray-700/20 rounded-2xl shadow-lg p-8">
      <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Full Name</label>
            <input 
              type="text" 
              id="name" 
              name="name"
              [value]="currentUser()?.name || ''"
              disabled
              class="w-full px-4 py-3 bg-gray-200/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none placeholder-gray-500 transition disabled:cursor-not-allowed">
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              [value]="currentUser()?.email || ''"
              disabled
              class="w-full px-4 py-3 bg-gray-200/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none placeholder-gray-500 transition disabled:cursor-not-allowed">
          </div>
        </div>

        <div>
          <label for="subject" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Subject</label>
          <input 
            type="text" 
            id="subject" 
            name="subject"
            [ngModel]="subject()"
            (ngModelChange)="subject.set($event)"
            required
            placeholder="e.g., Issue with timetable display"
            class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none placeholder-gray-500 transition">
        </div>

        <div>
          <label for="message" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Message</label>
          <textarea 
            id="message" 
            name="message" 
            [ngModel]="message()"
            (ngModelChange)="message.set($event)"
            required
            rows="6"
            placeholder="Please describe your issue or suggestion in detail..."
            class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none placeholder-gray-500 transition"></textarea>
        </div>

        <div class="flex justify-end">
          <button 
            type="submit" 
            [disabled]="isSubmitting() || contactForm.invalid"
            class="w-full md:w-auto bg-purple-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-purple-700 shadow-md hover:shadow-lg transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center">
              @if(isSubmitting()) {
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Sending...</span>
              } @else {
                <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                </svg>
                <span>Send Message</span>
              }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
