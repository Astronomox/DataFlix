<aside
  class="w-64 bg-white dark:bg-gray-800 overflow-y-auto transition-transform duration-300 ease-in-out
         fixed inset-y-0 left-0 z-40 transform"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
  [class.p-4]="isOpen()">
  
  <div class="py-4 text-gray-500 dark:text-gray-400" [class.hidden]="!isOpen()">
    <a class="ml-6 text-lg font-bold text-gray-800 dark:text-gray-200" href="#">
      DataFlix
    </a>
    <ul class="mt-6">
      @for (link of navLinks; track link.path) {
        <li class="relative px-2">
          <a
            [routerLink]="link.path"
            routerLinkActive="text-gray-800 dark:text-gray-100 bg-purple-50 dark:bg-gray-700"
            [routerLinkActiveOptions]="{ exact: true }"
            class="inline-flex items-center w-full text-sm font-semibold transition-colors duration-150 hover:text-gray-800 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/50 rounded-lg p-4">
            <span
              class="absolute inset-y-0 left-0 w-1 bg-purple-600 rounded-tr-lg rounded-br-lg"
              aria-hidden="true"
              [routerLinkActive]="'block'"
              [routerLinkActiveOptions]="{ exact: true }"
              class="hidden"
            ></span>
            
            <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
              @if (link.icon === 'home') {
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
              }
              @if (link.icon === 'book-open') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0l-.062.077m15.482 0l.062.077m0 0l.062.077m-15.606-0.154l.062.077m15.482 0l-.062.077m-15.482 0l.062.077" />
              }
              @if (link.icon === 'calendar') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0h18M9.75 12.75h.008v.008H9.75v-.008zm3.75 0h.008v.008h-.008v-.008zm-3.75 3.75h.008v.008H9.75v-.008zm3.75 0h.008v.008h-.008v-.008z" />
              }
              @if (link.icon === 'megaphone') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
              }
              @if (link.icon === 'user') {
                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              }
              @if (link.icon === 'mail') {
                <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              }
              @if (link.icon === 'sparkle') {
                <path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
              }
            </svg>
            <span class="ml-4">{{ link.name }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</aside>
