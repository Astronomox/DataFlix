<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DataFlix</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Polyfill for process.env to prevent runtime errors in the browser
    window.process = { env: {} };
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* AI "Metaball" Icon Animation - Enhanced for subtlety and appeal */
    @keyframes blob-move1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(8px, -6px) scale(1.05); }
      50% { transform: translate(-5px, 10px) scale(0.95); }
      75% { transform: translate(4px, 4px) scale(1); }
    }
    @keyframes blob-move2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-4px, 7px) scale(0.95); }
      50% { transform: translate(6px, -5px) scale(1.05); }
      75% { transform: translate(-7px, -3px) scale(1); }
    }
    @keyframes blob-move3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(5px, 5px) scale(1.05); }
      50% { transform: translate(-8px, 4px) scale(0.95); }
      75% { transform: translate(6px, -6px) scale(1); }
    }
    .animate-blob1 { animation: blob-move1 18s ease-in-out infinite; transform-origin: center center; }
    .animate-blob2 { animation: blob-move2 15s ease-in-out infinite; transform-origin: center center; }
    .animate-blob3 { animation: blob-move3 12s ease-in-out infinite; transform-origin: center center; }
  </style>

{

    "@angular/router": "https://next.esm.sh/@angular/router@^20.3.12?external=rxjs",

    "@angular/common/http": "https://next.esm.sh/@angular/common@^20.3.12/http?external=rxjs",
    "@angular/platform-browser": "https://next.esm.sh/@angular/platform-browser@^20.3.12?external=rxjs",
    "@angular/forms": "https://next.esm.sh/@angular/forms@^20.3.12?external=rxjs",
    "@angular/core": "https://next.esm.sh/@angular/core@^20.3.12?external=rxjs",
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.2/+esm",
    "@google/genai": "https://next.esm.sh/@google/genai@^1.30.0?external=rxjs"
  }
}
